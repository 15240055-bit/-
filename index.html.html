  <p class="hint">可以自由新增或刪除顏色；空白行與完全相同的重複選項會自動略過。</p>

  <button id="drawButton" type="button">幫我選</button>

  <section class="result" aria-live="polite" aria-atomic="true">
    <div>
      <div class="result-label">今天推薦穿搭顏色</div>
      <div id="resultText">準備好抽籤了嗎？</div>
      <div id="message"></div>
    </div>
  </section>
  <div class="count" id="count">目前有效選項：248 個</div>
</main>

<script>
  const optionsInput = document.getElementById('options');
  const resultText = document.getElementById('resultText');
  const message = document.getElementById('message');
  const count = document.getElementById('count');
  const drawButton = document.getElementById('drawButton');

  function getValidOptions() {
    // 去除每行前後空白、空白行，並移除完全相同的重複選項。
    // Set 會保留選項原本的順序。
    return [...new Set(
      optionsInput.value
        .split(/\r?\n/)
        .map(option => option.trim())
        .filter(option => option.length > 0)
    )];
  }

  function updateCount() {
    count.textContent = `目前有效選項：${getValidOptions().length} 個`;
  }

  drawButton.addEventListener('click', () => {
    const options = getValidOptions();
    updateCount();
    message.textContent = '';

    if (options.length === 0) {
      resultText.textContent = '';
      message.textContent = '請先輸入至少一個選項';
      return;
    }

    // 每個有效選項各占一個索引，因此中籤機率相同。
    const randomIndex = Math.floor(Math.random() * options.length);
    resultText.textContent = options[randomIndex];
  });

  optionsInput.addEventListener('input', updateCount);
  updateCount();
</script>
